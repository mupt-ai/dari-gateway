name: Publish npm package

# Runs in the public mirror (mupt-ai/dari-gateway), where this directory is the root.
# Publishes when the package.json version is not on npm yet.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require the mirrored main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "npm releases must be published from the mirrored main branch." >&2
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          registry-url: https://registry.npmjs.org

      - name: Check package version
        id: version
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "@mupt-ai/dari-gateway@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "@mupt-ai/dari-gateway@${PACKAGE_VERSION} is already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.publish == 'true'
        with:
          bun-version: "1.3.14"

      - name: Install npm with trusted publishing support
        if: steps.version.outputs.publish == 'true'
        run: npm install --global npm@11

      # The monorepo links the router with file:, which npm cannot install. Publish
      # the registry version instead; keep ROUTER_VERSION equal to the router version
      # the gateway was tested against.
      - name: Pin the published router version
        if: steps.version.outputs.publish == 'true'
        env:
          ROUTER_VERSION: "0.2.4"
        run: |
          set -euo pipefail
          npm view "@mupt-ai/dari-router@${ROUTER_VERSION}" version
          npm pkg set "dependencies.@mupt-ai/dari-router=${ROUTER_VERSION}"

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: bun install

      - name: Validate and build package
        if: steps.version.outputs.publish == 'true'
        run: bun run typecheck && bun test && bun run build

      # Installs the packed tarball the way a consumer would, against the router
      # on npm, and imports it. Catches a router that lacks the gateway's APIs.
      - name: Smoke test the packed tarball
        if: steps.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          pack_dir="${RUNNER_TEMP}/gateway-pack"
          consumer="${RUNNER_TEMP}/gateway-consumer"
          mkdir -p "${pack_dir}" "${consumer}"
          npm pack --pack-destination "${pack_dir}"
          tarball="$(ls "${pack_dir}"/*.tgz)"

          cd "${consumer}"
          npm init -y >/dev/null
          npm pkg set type=module
          npm install --no-audit --no-fund "${tarball}" typescript@5.9.3 @types/node@24
          bun -e '
            const root = await import("@mupt-ai/dari-gateway");
            const handler = await import("@mupt-ai/dari-gateway/http/handler");
            if (typeof root.createRequestHandler !== "function") throw new Error("root export missing");
            if (typeof handler.createRequestHandler !== "function") throw new Error("subpath export missing");
            console.log("published shape imports ok");
          '

          # Strict NodeNext consumers type-check against the emitted declarations.
          cat > tsconfig.json <<'JSON'
          {"compilerOptions":{"target":"ES2022","module":"nodenext","moduleResolution":"nodenext","strict":true,"noUncheckedIndexedAccess":true,"exactOptionalPropertyTypes":true,"noEmit":true,"types":["node"]},"include":["index.ts"]}
          JSON
          cat > index.ts <<'TS'
          import { createRequestHandler } from "@mupt-ai/dari-gateway";
          import { createPrioritySelectorBackend } from "@mupt-ai/dari-gateway/strategies/priority_selector";
          import { HttpError } from "@mupt-ai/dari-gateway/http/errors";
          import type { GatewayPlatform, RequestSummary } from "@mupt-ai/dari-gateway/platform/platform";
          export const used = [createRequestHandler, createPrioritySelectorBackend, HttpError];
          export type Used = [GatewayPlatform, RequestSummary];
          TS
          npx tsc -p .
          node -e 'import("@mupt-ai/dari-gateway").then((m) => { if (typeof m.createRequestHandler !== "function") process.exit(1); })'

      - name: Publish package
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public --provenance
