name: CI

# Runs in the public mirror (mupt-ai/dari-gateway), where this directory is the root.
# Pull requests only: mirror pushes to main are validated in the source
# repository, and the publish workflow validates again after waiting for the
# pinned router to reach npm, which a push-triggered run here would race.

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
